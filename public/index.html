<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SimpleCloud</title>
        <link rel="stylesheet" href="/app.css" />
    </head>
    <body>
        <div id="login-screen" class="screen">
            <div class="login-card">
                <h1>SimpleCloud</h1>
                <form id="login-form">
                    <label
                        ><span>Username</span
                        ><input
                            type="text"
                            name="username"
                            autocomplete="username"
                            required
                            autofocus
                    /></label>
                    <label
                        ><span>Password</span
                        ><input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                    /></label>
                    <div id="login-error" class="error-banner hidden"></div>
                    <button type="submit" id="login-btn">Sign in</button>
                </form>
            </div>
        </div>

        <div id="app-screen" class="screen hidden">
            <header class="app-header">
                <h1 class="app-title">SimpleCloud</h1>
                <div class="header-right">
                    <span id="current-user"></span>
                    <button id="logout-btn" class="btn btn-outline">
                        Logout
                    </button>
                </div>
            </header>

            <div class="toolbar">
                <div class="breadcrumbs" id="breadcrumbs"></div>
                <div class="toolbar-actions">
                    <button id="upload-btn" class="btn btn-primary">
                        Upload
                    </button>
                    <button id="create-folder-btn" class="btn">
                        New Folder
                    </button>
                    <button id="refresh-btn" class="btn" title="Refresh">
                        &#x21bb;
                    </button>
                </div>
            </div>

            <div id="error-banner" class="error-banner hidden"></div>

            <div class="file-table-wrapper">
                <table class="file-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">
                                Name <span class="sort-arrow"></span>
                            </th>
                            <th class="sortable" data-sort="type">
                                Type <span class="sort-arrow"></span>
                            </th>
                            <th class="sortable" data-sort="size">
                                Size <span class="sort-arrow"></span>
                            </th>
                            <th class="sortable" data-sort="modifiedAt">
                                Modified <span class="sort-arrow"></span>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-list"></tbody>
                </table>
                <div id="loading-state" class="loading hidden">Loading...</div>
                <div id="empty-state" class="empty-state hidden">
                    This folder is empty.
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button id="prev-page" class="btn" disabled>Previous</button>
                <span id="page-info"></span>
                <button id="next-page" class="btn" disabled>Next</button>
            </div>
        </div>

        <input type="file" id="upload-input" class="hidden" multiple />

        <div id="folder-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-card">
                <h2>New Folder</h2>
                <input
                    type="text"
                    id="folder-name-input"
                    placeholder="Folder name"
                    autofocus
                />
                <div class="modal-actions">
                    <button id="folder-cancel" class="btn">Cancel</button>
                    <button id="folder-confirm" class="btn btn-primary">
                        Create
                    </button>
                </div>
            </div>
        </div>

        <div id="rename-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-card">
                <h2>Rename</h2>
                <input type="text" id="rename-input" placeholder="New name" />
                <div class="modal-actions">
                    <button id="rename-cancel" class="btn">Cancel</button>
                    <button id="rename-confirm" class="btn btn-primary">
                        Rename
                    </button>
                </div>
            </div>
        </div>

        <div id="delete-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-card">
                <h2>Delete</h2>
                <p>
                    Are you sure you want to delete
                    <strong id="delete-name"></strong>?
                </p>
                <div class="modal-actions">
                    <button id="delete-cancel" class="btn">Cancel</button>
                    <button id="delete-confirm" class="btn btn-danger">
                        Delete
                    </button>
                </div>
            </div>
        </div>

        <div id="publish-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-card publish-card">
                <h2>Public Link</h2>
                <p class="publish-path" id="publish-path"></p>
                <div class="publish-url-box">
                    <input type="text" id="publish-url-input" readonly />
                    <button id="publish-copy-btn" class="btn btn-sm">
                        Copy
                    </button>
                </div>
                <div class="modal-actions">
                    <button id="publish-close" class="btn">Close</button>
                    <button
                        id="publish-revoke-btn"
                        class="btn btn-danger btn-sm"
                    >
                        Revoke
                    </button>
                </div>
            </div>
        </div>

        <script src="/app.js"></script>
    </body>
</html>
